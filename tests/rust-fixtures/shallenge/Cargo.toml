[package]
name = "llvm-metal-fixture-shallenge"
version = "0.1.0"
edition = "2024"
publish = false

# Device fixtures have their own dependency resolution and build target.
[workspace]
resolver = "3"

[features]
# build.py wires this to the consumer feature only in an explicit local snapshot.
compiler-probes = []

[dependencies.vanity-logic]
package = "logic"
git = "https://github.com/brandonros/vanity-miner-rs"
rev = "f26605ebddc829dd3d6b5f3f4c3cd6276c14f2de"
default-features = false
features = ["shallenge"]

[profile.release]
panic = "abort"
codegen-units = 1
