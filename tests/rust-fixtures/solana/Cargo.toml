[package]
name = "llvm-metal-fixture-solana"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[features]
consumer = []

[dependencies]
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }

[dependencies.vanity-logic]
package = "logic"
git = "https://github.com/brandonros/vanity-miner-rs"
rev = "f26605ebddc829dd3d6b5f3f4c3cd6276c14f2de"
default-features = false
features = ["solana"]
optional = true

[dev-dependencies]
sha2 = "=0.10.9"
num-bigint = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
